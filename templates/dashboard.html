<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Smart Election Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.dashboard{
    max-width:1300px;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.card h3{
    color:#94a3b8;
    margin-bottom:10px;
}

.card-value{
    font-size:32px;
    font-weight:bold;
}

.charts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.chart-card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

.integrity-valid{
    color:#22c55e;
    font-weight:bold;
}

.integrity-invalid{
    color:#ef4444;
    font-weight:bold;
}

@media(max-width:900px){
    .charts{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<h1>🗳️ AI Smart Election Dashboard</h1>
<div class="subtitle">
Live Monitoring • Blockchain Security • Auto Refresh
</div>

<div class="dashboard">

<div class="cards">

<div class="card">
<h3>Total Votes</h3>
<div class="card-value" id="totalVotes">0</div>
</div>

<div class="card">
<h3>Leading Candidate</h3>
<div class="card-value" id="leader">-</div>
</div>

<div class="card">
<h3>Security Score</h3>
<div class="card-value" id="securityScore">100%</div>
</div>

<div class="card">
<h3>Blockchain Status</h3>
<div class="card-value" id="integrityStatus">
Checking...
</div>
</div>

</div>

<div class="charts">

<div class="chart-card">
<h3>Vote Distribution</h3>
<canvas id="barChart"></canvas>
</div>

<div class="chart-card">
<h3>Vote Share</h3>
<canvas id="pieChart"></canvas>
</div>

</div>

</div>

<script>

const barCtx =
document.getElementById('barChart').getContext('2d');

const pieCtx =
document.getElementById('pieChart').getContext('2d');

const barChart = new Chart(barCtx,{
    type:'bar',
    data:{
        labels:[],
        datasets:[{
            label:'Votes',
            data:[],
            backgroundColor:'#38bdf8'
        }]
    },
    options:{
        responsive:true,
        scales:{
            y:{
                beginAtZero:true
            }
        }
    }
});

const pieChart = new Chart(pieCtx,{
    type:'pie',
    data:{
        labels:[],
        datasets:[{
            data:[],
            backgroundColor:[
                '#2563eb',
                '#dc2626',
                '#16a34a',
                '#f59e0b',
                '#7c3aed',
                '#ec4899',
                '#06b6d4',
                '#84cc16'
            ],
            borderColor:'#ffffff',
            borderWidth:2
        }]
    },
    options:{
        responsive:true,
        plugins:{
            legend:{
                position:'bottom',
                labels:{
                    color:'white'
                }
            },
            tooltip:{
                callbacks:{
                    label:function(context){

                        let total =
                        context.dataset.data.reduce(
                            (a,b)=>a+b,0
                        );

                        let value =
                        context.raw;

                        let percentage =
                        ((value/total)*100).toFixed(1);

                        return context.label +
                        ': ' +
                        value +
                        ' votes (' +
                        percentage +
                        '%)';
                    }
                }
            }
        }
    }
});

async function loadResults(){

    const response =
    await fetch('/api/results');

    const data =
    await response.json();

    document.getElementById('totalVotes').innerText =
    data.total_votes;

    const labels =
    data.results.map(x=>x.party);

    const votes =
    data.results.map(x=>x.votes);

    if(data.results.length > 0){

        document.getElementById('leader').innerText =
        data.results[0].party;

    }

    barChart.data.labels = labels;
    barChart.data.datasets[0].data = votes;
    barChart.update();

    pieChart.data.labels = labels;

pieChart.data.datasets[0].data = votes;

pieChart.data.datasets[0].backgroundColor = [
    '#2563eb',
    '#dc2626',
    '#16a34a',
    '#f59e0b',
    '#7c3aed',
    '#ec4899',
    '#06b6d4',
    '#84cc16'
].slice(0, labels.length);

pieChart.update();
}

async function loadIntegrity(){

    const response =
    await fetch('/api/integrity');

    const data =
    await response.json();

    const status =
    document.getElementById('integrityStatus');

    const score =
    document.getElementById('securityScore');

    if(data.valid){

        status.innerHTML =
        '<span class="integrity-valid">✓ Verified</span>';

        score.innerText = '100%';

    }
    else{

        status.innerHTML =
        '<span class="integrity-invalid">✗ Tampered</span>';

        score.innerText = '50%';

    }
}

async function refresh(){

    await loadResults();

    await loadIntegrity();
}

refresh();

setInterval(refresh,3000);

</script>

</body>
</html>
